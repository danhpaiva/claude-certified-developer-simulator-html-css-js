name: Deploy to GitHub Pages

# Entrega contínua: a cada push em main, valida e publica o site estático no GitHub Pages.
# Pré-requisito (uma vez): Settings → Pages → Build and deployment → Source = "GitHub Actions".
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela a que está em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validar e empacotar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências de desenvolvimento
        run: npm ci

      - name: Validar antes de publicar
        run: npm test

      - name: Montar a pasta do site com cache-busting
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
